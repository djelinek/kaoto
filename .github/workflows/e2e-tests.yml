name: 🧪 E2E Tests (Cypress)

on:
  workflow_call:
    inputs:
      full-matrix:
        description: Run all browsers (Chrome + Firefox + Edge). When false, only Chrome is run.
        required: false
        type: boolean
        default: true
      include-weekly-tests:
        description: Include tests tagged @weekly (nightly/release runs). When false, weekly-tagged tests are excluded.
        required: false
        type: boolean
        default: false

jobs:
  # Builds the UI that the test jobs serve with `vite preview`. It starts no browser, so it runs on the runner rather
  # than in the browsers' container, which takes about 20 s to start.
  build:
    name: Build UI
    runs-on: ubuntu-latest
    steps:
      - name: 👷‍♀️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup workspace
        uses: ./.github/actions/kaoto-setup-workspace

      - name: 🔧 Build the UI
        run: yarn workspace @kaoto/kaoto run build:dev

      - name: 💾 Save build folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          if-no-files-found: error
          path: packages/ui/dist

  # One job per browser and shard, which GitHub names after the matrix values, e.g. "Test (chrome, 1)". The name holds
  # no matrix expression, because a matrix job skipped after a failed build shows its name unresolved.
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    container:
      image: cypress/browsers:node-24.17.0-chrome-149.0.7827.155-1-ff-152.0-edge-149.0.4022.69-1
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.full-matrix && '["chrome", "firefox", "edge"]' || '["chrome"]') }}
        # cypress-split runs a part of the specs in each shard, so SPLIT below must equal the number of shards.
        shard: [1, 2, 3, 4]
    steps:
      - name: 👷‍♀️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🔧 Setup workspace
        uses: ./.github/actions/kaoto-setup-workspace

      - name: 🔧 Setup Cypress
        uses: ./.github/actions/kaoto-setup-cypress

      - name: 🗄️ Download the UI build folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: packages/ui/dist

      - name: 🔨 Cypress run
        uses: cypress-io/github-action@0ed14f5d30c4ad6e5e8ffb6f57dbb69150137a3f # v7.4.10
        with:
          browser: ${{ matrix.browser }}
          # The two setup steps above installed the dependencies and the Cypress binary.
          install: false
          start: yarn workspace @kaoto/kaoto run preview --host
          config: baseUrl=http://localhost:4173
          working-directory: packages/ui-tests
          wait-on: 'http://127.0.0.1:4173'
          wait-on-timeout: 120
          expose: ${{ inputs.include-weekly-tests && 'grepTags=' || 'grepTags=-weekly' }}
        env:
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLIT: 4
          SPLIT_INDEX1: ${{ matrix.shard }}

      - name: 💾 Save videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videos-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/ui-tests/cypress/videos

      - name: 💾 Save screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.shard }}
          path: packages/ui-tests/cypress/screenshots
