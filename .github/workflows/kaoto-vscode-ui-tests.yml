name: 🧪 VS Code Kaoto Integration Tests

on:
  workflow_call:
    inputs:
      vsix-artifact-name:
        description: Name of the VSIX artifact to download
        required: true
        type: string
      vsix-file:
        description: Filename of the VSIX inside the artifact (defaults to kaoto-ci.vsix)
        required: false
        type: string
        default: kaoto-ci.vsix
      matrix:
        description: The test groups and OSes to run, as the JSON matrix from the kaoto-vscode-ui-test-matrix action
        required: true
        type: string
      retention-days:
        description: Number of days to retain uploaded test artifacts (logs, screenshots)
        required: false
        type: number
        default: 2

permissions:
  contents: read

jobs:
  # One job per test group and OS, so a run lists only the groups that run. The kaoto-vscode-ui-test-matrix action
  # builds the matrix from the `ciTestGroups` field in the package.json of @kaoto/ui-tests-vscode, which lists every
  # group, the smoke groups and the Linux-only ones (see that package's README).
  ui-tests:
    name: ${{ matrix.group }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaoto-setup-workspace
      - uses: ./.github/actions/kaoto-vscode-setup-tools
        with:
          install-jbang: 'true'
          allow-unprivileged-userns: 'true'
      # Through Camel JBang the extension downloads Camel, its plugins and the dependencies of the test projects into
      # the local Maven repository, Citrus does the same, and JBang compiles the scripts it runs into its cache. Each
      # group caches both for its OS under a key made of the Camel catalog package, whose catalogs decide the Camel
      # versions the extension asks for, and the pom.xml files of the test projects. A new key starts from an empty
      # repository rather than an older entry, since Maven never removes what a group no longer uses.
      - name: Restore Maven and JBang downloads
        id: downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.jbang/cache
          key: ui-tests-maven-${{ runner.os }}-${{ runner.arch }}-${{ matrix.group }}-${{ hashFiles('node_modules/@kaoto/camel-catalog/package.json', 'packages/ui-tests-vscode/test Fixture with speci@l chars/**/pom.xml') }}
      - if: matrix.group == 'deploy'
        uses: ./.github/actions/kaoto-vscode-setup-minikube
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.vsix-artifact-name }}
          path: packages/ui-tests-vscode
      - name: Set display resolution
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      # Fork test only: whether the workspace links in node_modules came back as links after a cache restore.
      - name: Show workspace links (fork test)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($p in 'node_modules/vscode-kaoto', 'node_modules/@kaoto/kaoto', 'node_modules/@kaoto/forms') {
            if (Test-Path $p) { Get-Item $p | Format-List FullName, LinkType, Target } else { "missing: $p" }
          }
      - name: Run ${{ matrix.group }} tests
        shell: bash
        env:
          KAOTO_DISABLE_WHATS_NEW: 'true'
          TEST_RESOURCES: ${{ runner.temp }}/kaoto-tests
          CODE_VERSION: max # Latest stable VS Code version supported by ExTester UI testing framework
          VSIX_FILE: ${{ inputs.vsix-file }}
          TEST_GROUP: ${{ matrix.group }}
        run: |
          # The deployment tests build their images in Minikube's Docker daemon.
          if [ "$TEST_GROUP" = deploy ]; then
            eval "$(minikube -p minikube docker-env)"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a yarn workspace @kaoto/ui-tests-vscode "test:ui:vsix:$TEST_GROUP"
          else
            yarn workspace @kaoto/ui-tests-vscode "test:ui:vsix:$TEST_GROUP"
          fi
      # Only a push to main saves, after the group passed, so an entry holds everything the group downloads. A push
      # runs the groups and operating systems of a pull request, so the nightly's Linux and macOS groups, which only
      # the nightly would read, take up no cache storage.
      - name: Save Maven and JBang downloads
        if: steps.downloads.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.jbang/cache
          key: ${{ steps.downloads.outputs.cache-primary-key }}
      - name: Upload test artifacts
        if: failure()
        uses: ./.github/actions/kaoto-vscode-upload-test-artifacts
        with:
          test-group: ${{ matrix.group }}
          os-name: ${{ matrix.os }}
          storage-path: ${{ runner.temp }}/kaoto-tests
          retention-days: ${{ inputs.retention-days }}
