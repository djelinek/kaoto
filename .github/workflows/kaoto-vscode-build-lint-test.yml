name: 🏗️ VS Code Kaoto Build

on:
  workflow_call:
    inputs:
      run-full-ui-tests:
        description: Run every UI test group listed in packages/ui-tests-vscode/package.json, not only the smoke groups
        required: true
        type: boolean
      full-matrix:
        description: Run tests on all OS platforms (Linux + macOS + Windows). When false, only Windows is used.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Builds the VSIX that the UI tests install. The extension's lint, build and unit tests run in its Packages job in
  # build-lint-test.yml, like those of every other workspace.
  vsix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ui-test-matrix: ${{ steps.ui-test-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select UI test groups
        id: ui-test-matrix
        uses: ./.github/actions/kaoto-vscode-ui-test-matrix
        with:
          full: ${{ inputs.run-full-ui-tests }}
          all-os: ${{ inputs.full-matrix }}

      - name: Setup workspace
        uses: ./.github/actions/kaoto-setup-workspace

      # Webpack takes most of this job's build, and every UI test job waits for the VSIX. Its cache holds the built
      # modules and is checked against the sources, so the key only changes with yarn.lock and the webpack config, and
      # a new key starts from the latest entry. Only a push saves, after the build.
      - name: Restore webpack cache
        id: webpack-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/webpack-cache
          key: webpack-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock', 'packages/kaoto-vscode/webpack.config.js') }}
          restore-keys: webpack-${{ runner.os }}-${{ runner.arch }}-

      - name: Build webview and extension
        run: yarn workspace vscode-kaoto build
        env:
          KAOTO_WEBPACK_CACHE_DIR: ${{ runner.temp }}/webpack-cache

      - name: Save webpack cache
        if: steps.webpack-cache.outputs.cache-hit != 'true' && github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/webpack-cache
          key: ${{ steps.webpack-cache.outputs.cache-primary-key }}

      - name: Build VSIX
        run: yarn workspace vscode-kaoto build:vsix --out kaoto-ci.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vscode-kaoto-vsix
          path: packages/kaoto-vscode/kaoto-ci.vsix
          if-no-files-found: error
          retention-days: 2

  ui-tests:
    needs: vsix
    uses: ./.github/workflows/kaoto-vscode-ui-tests.yml
    with:
      vsix-artifact-name: vscode-kaoto-vsix
      matrix: ${{ needs.vsix.outputs.ui-test-matrix }}
