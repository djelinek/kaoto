name: 🚀 Build and Deploy main
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: 'deploy-main'
  cancel-in-progress: true

jobs:
  build-distribution:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🔧 Setup workspace'
        uses: ./.github/actions/kaoto-setup-workspace

      # Only the web application is deployed. Workspaces import each other from source, so it needs no other build.
      - name: '🔧 Build web application'
        run: yarn workspace @kaoto/kaoto build

      # The github-pages artifact holds the build as artifact.tar: deploy-pages publishes it, and deploy-images unpacks
      # it for the container image.
      - name: '📤 Upload artifact @kaoto/kaoto web application'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'packages/ui/dist'

  deploy-pages:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs:
      - build-distribution
    steps:
      - name: '🛰️ Setup Pages'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: '🚀 Deploy to GitHub Pages'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1 - it is the same as v5

  deploy-images:
    if: github.repository == 'KaotoIO/kaoto'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs:
      - build-distribution
    steps:
      - name: '🛰️ Checkout source code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: '🛰️ Download UI Dist'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: '${{ runner.temp }}'

      - name: '🛰️ Extract UI Dist'
        shell: bash
        run: |
          mkdir -p packages/ui/dist
          tar -xf "${RUNNER_TEMP}/artifact.tar" -C packages/ui/dist

      - name: '🛰️ Login to Container Registry'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: '🔧 Build Container Image'
        shell: bash
        # TODO: the container image name should be configurable via vars/secrets
        run: |
          docker build -t "quay.io/kaotoio/kaoto-app:main" .

      - name: '📤 Upload Container Image'
        shell: bash
        run: |
          docker push quay.io/kaotoio/kaoto-app:main
